name: Deploy static MNEMOS demo to Pages

on:
  push:
    branches:
      - main
    paths:
      - "demo/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate static demo package
        run: python demo/frontend/validate_static_demo.py

      - name: Build Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R demo/frontend/. _site/
          rm -rf _site/__pycache__
          cp demo/demo_index.json _site/demo_index.json
          cp -R demo/traces _site/traces
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
