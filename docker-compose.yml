services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: mnemos-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mnemos-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=mnemos
      - POSTGRES_USER=mnemos
      - POSTGRES_PASSWORD=mnemos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemos -d mnemos"]
      interval: 10s
      timeout: 5s
      retries: 5

  mnemos:
    build: .
    container_name: mnemos-service
    runtime: nvidia
    ports:
      - "8700:8700"
    volumes:
      - ./data:/app/data
    environment:
      - MNEMOS_TIERS=qdrant
      - MNEMOS_EMBEDDING_MODEL=nomic-ai/nomic-embed-text-v1.5
      - MNEMOS_EMBEDDING_MODEL_NAME=nomic-embed-text-v1.5
      - "MNEMOS_EMBEDDING_MODEL_PREFIX_DOC=search_document: "
      - "MNEMOS_EMBEDDING_MODEL_PREFIX_QUERY=search_query: "
      - MNEMOS_BUDGET_AWARE_ROUTING=true
      - MNEMOS_LATENCY_BUDGET_MS=75
      - MNEMOS_QUANT_BITS=4
      - MNEMOS_AUDIT_ENABLED=true
      - MNEMOS_PORT=8700
      - MNEMOS_LOG_LEVEL=INFO
      - MNEMOS_GPU_DEVICE=cuda
      - MNEMOS_QDRANT_URL=http://qdrant:6333
      - MNEMOS_QDRANT_COLLECTION=mnemos_claude_repo_seed
      - MNEMOS_POSTGRES_DSN=postgresql://mnemos:mnemos@postgres:5432/mnemos
      - NVIDIA_VISIBLE_DEVICES=all
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  research-ui:
    build: .
    container_name: mnemos-research-ui
    command: ["python", "tools/mnemos_research_ui.py", "--host", "0.0.0.0", "--port", "8788", "--upload-dir", "/app/data/research_uploads"]
    ports:
      - "8788:8788"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - MNEMOS_BASE_URL=http://mnemos:8700
      - OLLAMA_BASE_URL=http://host.docker.internal:7777
      - MNEMOS_EVIDENCE_RECEIPT_DIR=/app/logs/evidence_receipts
    depends_on:
      mnemos:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8788/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  openwebui-proxy:
    build: .
    container_name: mnemos-openwebui-proxy
    command: ["python", "tools/mnemos_ollama_openwebui_proxy.py", "--host", "0.0.0.0", "--port", "8790"]
    ports:
      - "8790:8790"
    volumes:
      - ./logs:/app/logs
    environment:
      - MNEMOS_BASE_URL=http://mnemos:8700
      - OLLAMA_BASE_URL=http://host.docker.internal:7777
      - MNEMOS_EVIDENCE_RECEIPT_DIR=/app/logs/evidence_receipts
    depends_on:
      mnemos:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8790/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  qdrant_data:
  postgres_data:
